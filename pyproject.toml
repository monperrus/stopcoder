[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stopcoder"
dynamic = ["version"]
description = "Label why your coding agent stopped, from your own Claude Code / Codex transcripts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
stopcoder = "stopcoder._cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[tool.hatch.version]
path = "stopcoder/__init__.py"

[tool.ruff]
line-length = 120
